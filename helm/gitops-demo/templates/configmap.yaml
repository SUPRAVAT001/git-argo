apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "gitops-demo.fullname" . }}-config
  labels:
    {{- include "gitops-demo.labels" . | nindent 4 }}
data:
  APP_NAME: {{ .Values.env.appName | quote }}
  APP_ENV: {{ .Values.env.appEnv | quote }}
  GITOPS_TOOL: {{ .Values.env.gitopsTool | quote }}

