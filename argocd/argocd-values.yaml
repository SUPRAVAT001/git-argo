# Lean configuration for Argo CD on Minikube
# Omits Dex, Notifications, and ApplicationSet to conserve node memory.
# Increases probe timeouts to 10s to prevent false-positive kills in WSL2 Minikube.
global:
  domain: argocd.local

crds:
  install: true

dex:
  enabled: false

notifications:
  enabled: false

applicationSet:
  replicas: 0

server:
  insecure: true
  replicas: 1
  livenessProbe:
    timeoutSeconds: 10
    periodSeconds: 15
    failureThreshold: 5
    initialDelaySeconds: 30
  readinessProbe:
    timeoutSeconds: 10
    periodSeconds: 15
    failureThreshold: 5
    initialDelaySeconds: 15
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 250m
      memory: 128Mi

repoServer:
  replicas: 1
  livenessProbe:
    timeoutSeconds: 10
    periodSeconds: 15
    failureThreshold: 5
    initialDelaySeconds: 30
  readinessProbe:
    timeoutSeconds: 10
    periodSeconds: 15
    failureThreshold: 5
    initialDelaySeconds: 15
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 250m
      memory: 128Mi

controller:
  replicas: 1
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 300m
      memory: 256Mi

redis:
  resources:
    requests:
      cpu: 20m
      memory: 32Mi
    limits:
      cpu: 100m
      memory: 64Mi
